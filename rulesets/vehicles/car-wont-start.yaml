id: car-wont-start
title: Car won't start
description: >
  A small diagnostic rule set for a car that will not start, chaining from what the driver
  notices to a likely cause and a next step. Illustrative only, not mechanical advice.
license: CC-BY-SA-4.0
tags: [diagnosis, negation, trap-cases, original]
source: Original to this repository.

relations:
  shows: The car shows this symptom when you try to start it.
  is: The car is in this condition or setting.
  has: The car has this fault or part condition.
  needs: The next step for the car.

rules:
  - { id: C1, if: [?c is vehicle, not ?c shows cranking, ?c shows dim_lights], then: ?c has weak_battery }
  - { id: C2, if: [?c is vehicle, not ?c shows cranking, ?c has old_battery, ?c is cold], then: ?c has weak_battery }
  - { id: C3, if: [?c is vehicle, not ?c shows cranking, ?c shows clicking, not ?c has weak_battery], then: ?c has starter_fault }
  - { id: C4, if: [?c shows cranking, ?c shows empty_fuel_gauge], then: ?c is out_of_fuel }
  - { id: C5, if: [?c shows stalling, ?c shows empty_fuel_gauge], then: ?c is out_of_fuel }
  - { id: C6, if: [?c shows cranking, ?c shows fuel_smell, not ?c is out_of_fuel], then: ?c is flooded }
  - { id: C7, if: [?c shows cranking, not ?c is out_of_fuel, not ?c is flooded], then: ?c has ignition_fault }
  - { id: C8, if: [?c shows stalling, not ?c is out_of_fuel], then: ?c has fuel_delivery_fault }
  - { id: C9, if: [?c is vehicle, not ?c shows cranking, not ?c has weak_battery, not ?c has starter_fault], then: ?c has unknown_electrical_fault }
  - { id: C10, if: [?c has weak_battery], then: ?c needs jump_start }
  - { id: C11, if: [?c is out_of_fuel], then: ?c needs fuel }
  - { id: C12, if: [?c is flooded], then: ?c needs wait_and_retry }
  - { id: C13, if: [?c has starter_fault], then: ?c needs mechanic }
  - { id: C14, if: [?c has ignition_fault], then: ?c needs mechanic }
  - { id: C15, if: [?c has fuel_delivery_fault], then: ?c needs mechanic }
  - { id: C16, if: [?c has unknown_electrical_fault], then: ?c needs mechanic }

facts:
  - car is vehicle

cases:
  - id: dead_battery
    facts: [car shows dim_lights]
    expect: [car has weak_battery, car needs jump_start]
    expect_not: [car needs mechanic]
  - id: cold_morning
    note: Lights look fine, but an old battery in the cold still counts as weak, which rules out the starter.
    facts: [car has old_battery, car is cold, car shows clicking]
    expect: [car has weak_battery, car needs jump_start]
    expect_not: [car has starter_fault, car needs mechanic]
  - id: clicking_starter
    facts: [car shows clicking]
    expect: [car has starter_fault, car needs mechanic]
    expect_not: [car needs jump_start]
  - id: empty_tank
    facts: [car shows cranking, car shows empty_fuel_gauge]
    expect: [car is out_of_fuel, car needs fuel]
    expect_not: [car has ignition_fault, car needs mechanic]
  - id: flooded_engine
    facts: [car shows cranking, car shows fuel_smell]
    expect: [car is flooded, car needs wait_and_retry]
    expect_not: [car has ignition_fault]
  - id: fuel_smell_but_empty
    note: Trap. An empty tank rules out flooding even with a fuel smell.
    facts: [car shows cranking, car shows fuel_smell, car shows empty_fuel_gauge]
    expect: [car is out_of_fuel, car needs fuel]
    expect_not: [car is flooded, car needs wait_and_retry]
  - id: cranks_no_start
    facts: [car shows cranking]
    expect: [car has ignition_fault, car needs mechanic]
    expect_not: [car needs fuel]
  - id: stalls
    facts: [car shows cranking, car shows stalling]
    expect: [car has fuel_delivery_fault, car has ignition_fault, car needs mechanic]
    expect_not: [car is out_of_fuel]
  - id: silent
    note: Nothing at all happens and nothing explains it.
    facts: []
    expect: [car has unknown_electrical_fault, car needs mechanic]
    expect_not: [car has weak_battery, car has starter_fault]
