id: animal-identification
title: Animal identification
description: >
  The textbook zoo-keeper exercise: identify one of seven animals from observable traits.
  It shows forward chaining through intermediate classes (mammal, bird, carnivore, ungulate).
  The rules are deliberately incomplete, so some real animals come out wrong; a model has to
  follow the rules, not zoology.
version: 1.0.0
license: CC-BY-SA-4.0
tags: [classification, negation, trap-cases, adapted]
source: >
  Written for this repository after the ZOOKEEPER rules in Patrick H. Winston,
  "Artificial Intelligence" (Addison-Wesley), a widely reproduced teaching example.

relations:
  has: The animal has this body part, covering or marking.
  gives: The animal produces this for its young.
  lays: The animal lays this.
  eats: The animal eats this.
  chews: The animal chews this.
  can: The animal is able to do this.
  is: The animal has this property or belongs to this class.

rules:
  - { id: Z1, if: [?a has hair], then: ?a is mammal }
  - { id: Z2, if: [?a gives milk], then: ?a is mammal }
  - { id: Z3, if: [?a has feathers], then: ?a is bird }
  - { id: Z4, if: [?a can fly, ?a lays eggs], then: ?a is bird }
  - { id: Z5, if: [?a is mammal, ?a eats meat], then: ?a is carnivore }
  - { id: Z6, if: [?a is mammal, ?a has pointed_teeth, ?a has claws, ?a has forward_eyes], then: ?a is carnivore }
  - { id: Z7, if: [?a is mammal, ?a has hooves], then: ?a is ungulate }
  - { id: Z8, if: [?a is mammal, ?a chews cud], then: ?a is ungulate }
  - { id: Z9, if: [?a is carnivore, ?a is tawny, ?a has dark_spots], then: ?a is cheetah }
  - { id: Z10, if: [?a is carnivore, ?a is tawny, ?a has black_stripes], then: ?a is tiger }
  - { id: Z11, if: [?a is ungulate, ?a has long_neck, ?a has long_legs, ?a has dark_spots], then: ?a is giraffe }
  - { id: Z12, if: [?a is ungulate, ?a has black_stripes], then: ?a is zebra }
  - { id: Z13, if: [?a is bird, not ?a can fly, ?a has long_neck, ?a has long_legs, ?a is black_and_white], then: ?a is ostrich }
  - { id: Z14, if: [?a is bird, not ?a can fly, ?a can swim, ?a is black_and_white], then: ?a is penguin }
  - { id: Z15, if: [?a is bird, ?a is good_flier], then: ?a is albatross }

cases:
  - id: cheetah
    facts: [a has hair, a has pointed_teeth, a has claws, a has forward_eyes, a is tawny, a has dark_spots]
    expect: [a is carnivore, a is cheetah, a is mammal]
    expect_not: [a is tiger, a is ungulate]
  - id: tiger
    facts: [a gives milk, a eats meat, a is tawny, a has black_stripes]
    expect: [a is carnivore, a is mammal, a is tiger]
    expect_not: [a is zebra, a is cheetah]
  - id: giraffe
    facts: [a has hair, a chews cud, a has long_neck, a has long_legs, a has dark_spots]
    expect: [a is giraffe, a is mammal, a is ungulate]
    expect_not: [a is cheetah, a is carnivore]
  - id: zebra
    facts: [a gives milk, a has hooves, a has black_stripes]
    expect: [a is mammal, a is ungulate, a is zebra]
    expect_not: [a is tiger]
  - id: ostrich
    facts: [a has feathers, a has long_neck, a has long_legs, a is black_and_white]
    expect: [a is bird, a is ostrich]
    expect_not: [a is penguin, a is albatross]
  - id: penguin
    facts: [a has feathers, a lays eggs, a can swim, a is black_and_white]
    expect: [a is bird, a is penguin]
    expect_not: [a is ostrich]
  - id: albatross
    facts: [a has feathers, a can fly, a is good_flier]
    expect: [a is albatross, a is bird]
    expect_not: [a is penguin, a is ostrich]
  - id: housefly
    note: Trap. It flies and lays eggs, so rule Z4 makes it a bird.
    facts: [a can fly, a lays eggs]
    expect: [a is bird]
    expect_not: [a is mammal, a is albatross]
  - id: platypus
    note: Lays eggs and has hair; the rules only see a mammal.
    facts: [a has hair, a gives milk, a lays eggs, a can swim]
    expect: [a is mammal]
    expect_not: [a is bird, a is penguin]
  - id: flying_penguin
    note: Trap. A penguin that flies fails Z14, and nothing else names it.
    facts: [a has feathers, a can fly, a can swim, a is black_and_white]
    expect: [a is bird]
    expect_not: [a is penguin, a is albatross]
  - id: striped_cat
    note: Both cheetah-like spots and tiger stripes; both rules fire.
    facts: [a has hair, a eats meat, a is tawny, a has dark_spots, a has black_stripes]
    expect: [a is carnivore, a is cheetah, a is mammal, a is tiger]
    expect_not: [a is zebra]
