title: ProofWriter AttNeg-CWA-D5-647
description: "Bob is furry. Bob is green. Bob is kind. Bob is round. Charlie is red. Charlie is young. Gary is red. Harry is red. Harry is round. Harry is young. Big people are young. All furry people are kind. Red, round people are big. Red people are big. If Charlie is kind and Charlie is furry then Charlie is red. Furry, young people are round. Young people are round. If Gary is round and Gary is red then Gary is furry. If Charlie is not young then Charlie is green."
