relations:
  is: The subject has this property.
  needs: The subject needs the object.
  sees: The subject sees the object.
  visits: The subject visits the object.

rules:
  - { id: R1, if: [?x visits bald_eagle, ?x is round], then: bald_eagle sees squirrel }
  - { id: R2, if: [?x sees tiger, ?x needs squirrel], then: tiger is round }
  - { id: R3, if: [?x is nice], then: ?x visits bald_eagle }
  - { id: R4, if: [?x is round], then: ?x sees squirrel }
  - { id: R5, if: [?x sees squirrel], then: ?x is nice }

