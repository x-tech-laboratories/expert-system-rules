    expect_not: [squirrel sees mouse, squirrel needs bald_eagle, squirrel is rough, tiger needs mouse, bald_eagle needs tiger, tiger sees mouse, tiger sees tiger, bald_eagle needs bald_eagle, mouse needs tiger, tiger visits tiger, tiger sees bald_eagle, bald_eagle is round]
