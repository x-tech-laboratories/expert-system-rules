rules:
  - { id: R1, if: [?x is smart], then: ?x is blue }
  - { id: R2, if: [?x is green, ?x is red], then: ?x is blue }
  - { id: R3, if: [?x is young, ?x is furry], then: ?x is blue }
  - { id: R4, if: [?x is blue], then: ?x is smart }
  - { id: R5, if: [?x is white], then: ?x is green }
  - { id: R6, if: [?x is white, ?x is green], then: ?x is young }
  - { id: R7, if: [?x is young], then: ?x is red }
  - { id: R8, if: [harry is furry, harry is smart], then: harry is young }

