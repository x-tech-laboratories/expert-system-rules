id: relnoneg-cwa-d5-268
title: ProofWriter RelNoneg-CWA-D5-268
description: "The dog chases the rabbit. The dog is big. The dog visits the squirrel. The rabbit chases the dog. The rabbit likes the dog. The squirrel chases the rabbit. The squirrel chases the tiger. The squirrel visits the dog. The tiger chases the rabbit. The tiger is round. The tiger visits the rabbit. The tiger visits the squirrel. If something is nice then it is rough. If something is big and it likes the dog then the dog is round. If something chases the squirrel then it is big. If something likes the squirrel and it chases the squirrel then the squirrel is young. If the tiger is young and the tiger chases the rabbit then the rabbit visits the dog. If something is rough then it likes the squirrel. If something likes the squirrel then the squirrel is nice. If the rabbit chases the dog and the dog chases the rabbit then the rabbit is nice."
