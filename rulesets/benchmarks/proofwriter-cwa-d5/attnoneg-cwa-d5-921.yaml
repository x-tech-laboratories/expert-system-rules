description: "Anne is cold. Anne is furry. Anne is nice. Anne is red. Anne is white. Charlie is white. Fiona is cold. Fiona is furry. Fiona is nice. Fiona is red. Harry is big. Harry is furry. Harry is red. Harry is white. If Anne is big and Anne is round then Anne is furry. If something is furry then it is cold. All nice things are round. If Charlie is round then Charlie is big. If something is big and red then it is furry. If Charlie is white then Charlie is nice. If something is big and red then it is furry. All big things are furry. If something is round then it is nice."
