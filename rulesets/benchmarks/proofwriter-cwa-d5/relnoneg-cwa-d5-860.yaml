  The description holds the theory's original English.

relations:
  eats: The subject eats the object.
  is: The subject has this property.
  likes: The subject likes the object.
  needs: The subject needs the object.

rules:
  - { id: R1, if: [tiger eats bear], then: bear likes cow }
  - { id: R2, if: [?x eats tiger, tiger is rough], then: ?x is rough }
  - { id: R3, if: [?x eats cow], then: cow is rough }
  - { id: R4, if: [?x is kind], then: ?x needs tiger }
  - { id: R5, if: [?x is kind, ?x eats bear], then: ?x eats cow }
  - { id: R6, if: [?x needs bear], then: bear is red }
  - { id: R7, if: [cow is rough, cow eats bear], then: cow is cold }
  - { id: R8, if: [?x needs tiger], then: ?x eats bear }

facts:
  - bear is kind
  - bear is red
  - cat eats bear
  - cat eats tiger
  - cat is red
  - cat likes cow
  - cat likes tiger
  - cat needs bear
  - cat needs tiger
  - cow eats tiger
  - cow is red
  - cow needs tiger
  - tiger is cold
  - tiger is red
  - tiger likes bear
  - tiger needs bear

