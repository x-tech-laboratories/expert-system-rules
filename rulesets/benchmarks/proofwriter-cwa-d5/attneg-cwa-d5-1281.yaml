rules:
  - { id: R1, if: [?x is smart, ?x is rough], then: ?x is nice }
  - { id: R2, if: [?x is round], then: ?x is furry }
  - { id: R3, if: [?x is big], then: ?x is smart }
  - { id: R4, if: [?x is furry], then: ?x is big }
  - { id: R5, if: [?x is nice], then: ?x is big }
  - { id: R6, if: [dave is rough], then: dave is round }
  - { id: R7, if: [?x is smart], then: ?x is rough }

facts:
  - anne is furry
  - anne is rough
  - anne is smart
  - dave is rough
  - erin is round
  - erin is smart
  - harry is nice

