  - { id: R2, if: [?x is smart, ?x is white], then: ?x is quiet }
  - { id: R3, if: [?x is furry], then: ?x is smart }
  - { id: R4, if: [?x is round], then: ?x is furry }
  - { id: R5, if: [?x is green, ?x is white], then: ?x is young }
