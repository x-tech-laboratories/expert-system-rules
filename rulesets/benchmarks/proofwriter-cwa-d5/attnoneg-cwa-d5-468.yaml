id: attnoneg-cwa-d5-468
title: ProofWriter AttNoneg-CWA-D5-468
description: "Anne is furry. Anne is green. Bob is green. Bob is quiet. Bob is round. Bob is white. Bob is young. Gary is furry. Gary is white. Harry is smart. Harry is white. If something is quiet and furry then it is green. All smart, white things are quiet. Furry things are smart. If something is round then it is furry. If something is green and white then it is young. If Gary is white and Gary is young then Gary is round."
