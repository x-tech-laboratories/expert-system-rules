relations:
  is: The subject has this property.
  likes: The subject likes the object.
  needs: The subject needs the object.
  sees: The subject sees the object.

rules:
  - { id: R1, if: [?x sees dog, not ?x likes cow], then: ?x is nice }
  - { id: R2, if: [?x needs dog, dog is kind], then: ?x likes dog }
  - { id: R3, if: [?x is nice, not ?x likes cow], then: ?x needs mouse }
  - { id: R4, if: [?x needs mouse, not ?x is blue], then: mouse sees dog }
  - { id: R5, if: [?x likes cow, not ?x is nice], then: ?x is green }
  - { id: R6, if: [?x needs cow, not ?x is green], then: ?x is big }

facts:
  - cat sees cow
  - cat sees mouse
  - cow likes dog
  - cow likes mouse
  - cow sees dog
  - dog is blue
  - dog is nice
  - dog likes mouse
  - mouse is green
  - mouse needs cat

