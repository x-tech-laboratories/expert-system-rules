title: ProofWriter AttNoneg-CWA-D5-179
description: "Bob is kind. Bob is young. Dave is kind. Dave is red. Fiona is big. Fiona is cold. Fiona is kind. Fiona is smart. Fiona is young. Harry is big. Big, smart people are red. Young, red people are big. If someone is smart then they are red. All big, kind people are rough. Red, big people are kind. If someone is young then they are cold. All kind people are smart. All rough, smart people are young. All big people are smart."
