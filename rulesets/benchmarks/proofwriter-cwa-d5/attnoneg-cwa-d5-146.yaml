title: ProofWriter AttNoneg-CWA-D5-146
description: "Bob is red. Bob is young. Charlie is red. Dave is cold. Dave is round. Erin is kind. Erin is rough. Young, furry people are rough. Cold, rough people are young. All cold, red people are kind. Young, furry people are cold. If someone is cold then they are young. If someone is rough then they are red. All kind, round people are furry. Cold, young people are red. All rough people are young."
