id: relneg-cwa-d5-394
title: ProofWriter RelNeg-CWA-D5-394
description: "The bear chases the cow. The bear is green. The cow chases the mouse. The cow chases the rabbit. The mouse chases the bear. The mouse chases the cow. The mouse likes the bear. The rabbit chases the bear. The rabbit chases the cow. The rabbit likes the bear. The rabbit sees the mouse. If someone likes the mouse then the mouse likes the cow. If someone likes the cow then they chase the mouse. If someone chases the mouse then they are green. If someone chases the bear and they see the bear then the bear likes the mouse. If the bear is green and the bear sees the cow then the cow sees the bear. If someone is blue and they like the cow then they are rough. If someone is green then they like the mouse. If someone likes the rabbit then the rabbit sees the bear."
