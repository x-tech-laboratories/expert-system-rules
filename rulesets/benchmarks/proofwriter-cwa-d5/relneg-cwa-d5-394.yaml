relations:
  chases: The subject chases the object.
  is: The subject has this property.
  likes: The subject likes the object.
  sees: The subject sees the object.

rules:
  - { id: R1, if: [?x likes mouse], then: mouse likes cow }
  - { id: R2, if: [?x likes cow], then: ?x chases mouse }
  - { id: R3, if: [?x chases mouse], then: ?x is green }
  - { id: R4, if: [?x chases bear, ?x sees bear], then: bear likes mouse }
  - { id: R5, if: [bear is green, bear sees cow], then: cow sees bear }
  - { id: R6, if: [?x is blue, ?x likes cow], then: ?x is rough }
  - { id: R7, if: [?x is green], then: ?x likes mouse }
  - { id: R8, if: [?x likes rabbit], then: rabbit sees bear }

facts:
