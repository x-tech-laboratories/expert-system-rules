id: attnoneg-cwa-d5-286
title: ProofWriter AttNoneg-CWA-D5-286
description: "Anne is green. Anne is quiet. Anne is white. Bob is big. Bob is cold. Bob is kind. Bob is white. Dave is big. Dave is quiet. Harry is nice. All green things are kind. If something is quiet and green then it is white. If Dave is big then Dave is cold. If Harry is nice then Harry is green. Green, cold things are quiet. All green, kind things are quiet. White things are big. All green, big things are nice."
license: CC-BY-4.0
tags: [benchmark, proofwriter, closed-world, adapted]
source: >
  Converted mechanically from ProofWriter (Tafjord, Dalvi and Clark, 2021), closed-world version,
  theory AttNoneg-CWA-D5-286, by the Allen Institute for AI, released under CC BY at https://allenai.org/data/proofwriter.
  The description holds the theory's original English.

relations:
  is: The subject has this property.

rules:
  - { id: R1, if: [?x is green], then: ?x is kind }
  - { id: R2, if: [?x is quiet, ?x is green], then: ?x is white }
  - { id: R3, if: [dave is big], then: dave is cold }
  - { id: R4, if: [harry is nice], then: harry is green }
  - { id: R5, if: [?x is green, ?x is cold], then: ?x is quiet }
  - { id: R6, if: [?x is green, ?x is kind], then: ?x is quiet }
  - { id: R7, if: [?x is white], then: ?x is big }
  - { id: R8, if: [?x is green, ?x is big], then: ?x is nice }

facts:
  - anne is green
  - anne is quiet
  - anne is white
  - bob is big
  - bob is cold
  - bob is kind
  - bob is white
  - dave is big
  - dave is quiet
  - harry is nice

cases:
  - id: answers
    note: ProofWriter's own answers to its questions about this theory.
    expect: [anne is white, dave is quiet, anne is kind, dave is cold, harry is kind, anne is nice, harry is quiet, harry is white, harry is big]
    expect_not: [dave is kind, bob is quiet, dave is white, bob is nice, dave is nice, anne is cold, bob is green, dave is green]
