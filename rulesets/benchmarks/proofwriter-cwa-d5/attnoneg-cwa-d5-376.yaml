title: ProofWriter AttNoneg-CWA-D5-376
description: "Bob is blue. Bob is kind. Bob is nice. Bob is rough. Erin is green. Erin is nice. Fiona is cold. Fiona is furry. Harry is furry. Harry is rough. Nice, cold people are rough. All furry people are blue. If someone is kind and nice then they are furry. If someone is blue and green then they are kind. Nice people are cold. All rough, green people are furry. If Harry is furry and Harry is cold then Harry is blue. Kind people are cold."
