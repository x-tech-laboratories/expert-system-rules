id: attnoneg-cwa-d5-1277
title: ProofWriter AttNoneg-CWA-D5-1277
description: "Anne is rough. Bob is blue. Bob is nice. Erin is green. Fiona is big. Fiona is blue. Fiona is furry. Fiona is nice. Fiona is rough. Fiona is smart. Big things are rough. If Erin is nice and Erin is smart then Erin is big. If Anne is rough then Anne is nice. All rough things are big. Furry, big things are blue. Green things are rough. Big things are furry. If something is blue then it is smart."
license: CC-BY-4.0
tags: [benchmark, proofwriter, closed-world, adapted]
source: >
