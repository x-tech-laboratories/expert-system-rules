  The description holds the theory's original English.

relations:
  is: The subject has this property.

rules:
  - { id: R1, if: [?x is big], then: ?x is rough }
  - { id: R2, if: [erin is nice, erin is smart], then: erin is big }
  - { id: R3, if: [anne is rough], then: anne is nice }
  - { id: R4, if: [?x is rough], then: ?x is big }
  - { id: R5, if: [?x is furry, ?x is big], then: ?x is blue }
  - { id: R6, if: [?x is green], then: ?x is rough }
  - { id: R7, if: [?x is big], then: ?x is furry }
  - { id: R8, if: [?x is blue], then: ?x is smart }

facts:
  - anne is rough
  - bob is blue
  - bob is nice
  - erin is green
  - fiona is big
  - fiona is blue
  - fiona is furry
  - fiona is nice
  - fiona is rough
  - fiona is smart

