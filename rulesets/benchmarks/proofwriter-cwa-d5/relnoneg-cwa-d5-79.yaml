id: relnoneg-cwa-d5-79
title: ProofWriter RelNoneg-CWA-D5-79
description: "The bald eagle sees the cat. The bald eagle sees the squirrel. The cat is blue. The cat is cold. The cat is green. The cat sees the bald eagle. The cat sees the squirrel. The mouse chases the bald eagle. The mouse chases the cat. The mouse is cold. The mouse sees the cat. The squirrel likes the mouse. The squirrel sees the bald eagle. The squirrel sees the mouse. If something chases the bald eagle then the bald eagle is green. If something is green and it likes the bald eagle then the bald eagle is round. If something chases the cat and the cat is cold then it likes the bald eagle. If something sees the mouse and the mouse sees the cat then the cat sees the bald eagle. If something sees the bald eagle then it is cold. If the bald eagle likes the mouse then the bald eagle chases the cat. If something is green then it likes the mouse."
license: CC-BY-4.0
tags: [benchmark, proofwriter, closed-world, adapted]
source: >
  Converted mechanically from ProofWriter (Tafjord, Dalvi and Clark, 2021), closed-world version,
  theory RelNoneg-CWA-D5-79, by the Allen Institute for AI, released under CC BY at https://allenai.org/data/proofwriter.
  The description holds the theory's original English.

relations:
  chases: The subject chases the object.
  is: The subject has this property.
  likes: The subject likes the object.
  sees: The subject sees the object.

rules:
  - { id: R1, if: [?x chases bald_eagle], then: bald_eagle is green }
  - { id: R2, if: [?x is green, ?x likes bald_eagle], then: bald_eagle is round }
  - { id: R3, if: [?x chases cat, cat is cold], then: ?x likes bald_eagle }
  - { id: R4, if: [?x sees mouse, mouse sees cat], then: cat sees bald_eagle }
  - { id: R5, if: [?x sees bald_eagle], then: ?x is cold }
  - { id: R6, if: [bald_eagle likes mouse], then: bald_eagle chases cat }
  - { id: R7, if: [?x is green], then: ?x likes mouse }

facts:
  - bald_eagle sees cat
  - bald_eagle sees squirrel
  - cat is blue
  - cat is cold
  - cat is green
  - cat sees bald_eagle
  - cat sees squirrel
  - mouse chases bald_eagle
  - mouse chases cat
  - mouse is cold
  - mouse sees cat
  - squirrel likes mouse
  - squirrel sees bald_eagle
  - squirrel sees mouse

cases:
  - id: answers
    note: ProofWriter's own answers to its questions about this theory.
    expect: [cat sees squirrel, cat is blue, cat likes mouse, squirrel is cold, bald_eagle likes mouse, bald_eagle chases cat, bald_eagle likes bald_eagle, bald_eagle is round]
    expect_not: [cat likes bald_eagle, bald_eagle is cold, mouse likes mouse, squirrel likes bald_eagle, cat chases mouse, cat chases bald_eagle, squirrel is rough, squirrel chases cat, squirrel sees squirrel, mouse is green, squirrel chases squirrel, mouse sees mouse]
