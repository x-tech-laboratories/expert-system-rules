description: "Anne is big. Anne is cold. Anne is red. Bob is big. Bob is furry. Bob is red. Bob is rough. Bob is smart. Bob is young. Charlie is cold. Charlie is red. Charlie is smart. Charlie is young. Harry is smart. If Charlie is cold and Charlie is big then Charlie is young. All cold, rough things are furry. All smart things are young. Smart, red things are rough. All furry things are rough. Big things are red. All young things are big. Rough, big things are furry."
