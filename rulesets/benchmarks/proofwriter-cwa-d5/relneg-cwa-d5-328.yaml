id: relneg-cwa-d5-328
title: ProofWriter RelNeg-CWA-D5-328
description: "The bald eagle chases the dog. The bald eagle is kind. The bald eagle likes the cat. The bald eagle likes the lion. The bald eagle needs the lion. The cat is green. The cat needs the dog. The dog chases the lion. The lion is green. The lion is red. The lion is round. The lion needs the dog. If something likes the cat and the cat likes the bald eagle then it likes the bald eagle. If something likes the dog then the dog is round. If something is kind and it needs the dog then the dog is rough. If something chases the cat and it chases the lion then it is red. If something chases the bald eagle then the bald eagle likes the dog. If something is rough and it likes the lion then the lion is rough. If something likes the cat and it chases the dog then it chases the cat. If the dog is round then the dog needs the lion. If something is kind and it chases the cat then the cat chases the bald eagle."
