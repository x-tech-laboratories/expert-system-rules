relations:
  chases: The subject chases the object.
  is: The subject has this property.
  likes: The subject likes the object.
  needs: The subject needs the object.

rules:
  - { id: R1, if: [?x likes cat, cat likes bald_eagle], then: ?x likes bald_eagle }
  - { id: R2, if: [?x likes dog], then: dog is round }
  - { id: R3, if: [?x is kind, ?x needs dog], then: dog is rough }
  - { id: R4, if: [?x chases cat, ?x chases lion], then: ?x is red }
  - { id: R5, if: [?x chases bald_eagle], then: bald_eagle likes dog }
  - { id: R6, if: [?x is rough, ?x likes lion], then: lion is rough }
  - { id: R7, if: [?x likes cat, ?x chases dog], then: ?x chases cat }
  - { id: R8, if: [dog is round], then: dog needs lion }
  - { id: R9, if: [?x is kind, ?x chases cat], then: cat chases bald_eagle }

facts:
  - bald_eagle chases dog
  - bald_eagle is kind
  - bald_eagle likes cat
  - bald_eagle likes lion
  - bald_eagle needs lion
  - cat is green
  - cat needs dog
  - dog chases lion
  - lion is green
  - lion is red
  - lion is round
  - lion needs dog

