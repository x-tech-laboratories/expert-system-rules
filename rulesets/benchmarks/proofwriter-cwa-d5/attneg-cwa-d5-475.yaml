  The description holds the theory's original English.

relations:
  is: The subject has this property.

rules:
  - { id: R1, if: [dave is smart, dave is rough], then: dave is green }
  - { id: R2, if: [?x is smart, ?x is white], then: ?x is rough }
  - { id: R3, if: [?x is white, ?x is green], then: ?x is cold }
  - { id: R4, if: [?x is cold], then: ?x is white }
  - { id: R5, if: [?x is young], then: ?x is white }
  - { id: R6, if: [gary is cold], then: gary is green }
  - { id: R7, if: [fiona is young], then: fiona is rough }
  - { id: R8, if: [?x is rough, ?x is young], then: ?x is green }
  - { id: R9, if: [?x is smart], then: ?x is young }

facts:
  - bob is green
  - bob is smart
  - bob is young
  - dave is smart
  - fiona is cold
  - gary is cold
  - gary is rough

